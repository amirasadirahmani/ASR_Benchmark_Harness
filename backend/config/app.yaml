offline_mode: true
language: "fa"
strict_offline_guard: true

server:
  host: "127.0.0.1"
  port: 8000
  reload: false
  log_level: "info"
  allow_external_bind: false

paths:
  models_dir: "models"
  recordings_dir: "recordings"
  results_dir: "results"
  frontend_dir: "frontend"
  logs_dir: "logs"
  cache_dir: ".cache"
  temp_dir: data/temp

audio:
  sample_rate: 16000
  channels: 1
  sample_width: 2
  frame_ms: 20
  max_command_seconds: 30.0
  min_command_seconds: 0.30
  pre_roll_seconds: 1.5
  save_recordings: true

vad:
  engine: "webrtc"
  aggressiveness: 2
  silence_duration: 2.0
  speech_start_frames: 3
  energy_threshold_dbfs: -45.0
  post_wake_speech_timeout: 6.0

wake_word:
  enabled: true
  word: "آرینا"
  engine: "vosk"
  aliases: ["آرینا", "ارینا", "آرینه", "ارینا", "آرنا"]
  vosk_model_path: "models/wakeword/vosk-model-small-fa"
  dtw_templates_dir: "models/wakeword/dtw_templates"
  dtw_threshold: 0.42
  cooldown_seconds: 1.5
  listen_timeout: 0.0

benchmark:
  mode: "sequential"
  runs_per_model: 3
  warmup_enabled: true
  warmup_seconds: 1.0
  rotate_model_order: true
  rotation_strategy: "rotate"
  model_timeout: 300.0
  isolate_workers: true
  mp_context: spawn
  ram_sample_interval: 0.05

normalizer:
  profile: "default"
  zwnj_policy: "space"
  remove_punctuation: true
  unify_alef_hamza: true
  unify_alef_madda: false
  digits_to: "ascii"
  remove_diacritics: true

ui:
  title: "سامانه مقایسه مدل‌های تشخیص گفتار فارسی"
  language: "fa"
  direction: "rtl"
  no_reference_message: "جمله مبدا برای مقایسه و اعلام نتیجه وجود نداشت."
  show_raw_transcription: true

models_config_file: "backend/config/models.yaml"
