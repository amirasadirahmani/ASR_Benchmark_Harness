models:

  # ------------------------- مدل ۱ -------------------------
  - id: "whisper-base-fa-ct2"
    display_name: "Whisper Base FA (CT2/int8)"
    enabled: true
    runtime: "faster_whisper"
    local_path: "models/faster-whisper/whisper-base-fa"
    device: "auto"            # auto | cpu | cuda
    compute_type: "int8"      # int8 | int8_float16 | float16 | float32
    order: 1
    source:
      type: "huggingface"
      repo_id: "aictsharif/whisper-base-fa"
      convert: "ct2"
      quantization: "int8"
    params:
      language: "fa"
      task: "transcribe"
      beam_size: 5
      best_of: 5
      temperature: 0.0
      condition_on_previous_text: false
      vad_filter: false        # عمداً خاموش: VAD مستقل بیرون از مدل است
      without_timestamps: true
      cpu_threads: 4
    notes: "مدل پایه فارسی، سبک‌ترین گزینه برای Raspberry Pi 5"

  # ------------------------- مدل ۲ -------------------------
  - id: "whisper-small-fa-ct2"
    display_name: "Whisper Small FA (CT2/int8)"
    enabled: true
    runtime: "faster_whisper"
    local_path: "models/faster-whisper/whisper-small-fa"
    device: "auto"
    compute_type: "int8"
    order: 2
    source:
      type: "huggingface"
      repo_id: "aictsharif/whisper-small-fa"
      convert: "ct2"
      quantization: "int8"
    params:
      language: "fa"
      task: "transcribe"
      beam_size: 5
      best_of: 5
      temperature: 0.0
      condition_on_previous_text: false
      vad_filter: false
      without_timestamps: true
      cpu_threads: 4
    notes: "دقت بالاتر، مصرف RAM بیشتر"

  # ------------------------- مدل ۳ (نمونه، غیرفعال) -------------------------
  # آداپتور مرجع transformers — برای صحت‌سنجی خروجی CT2
  - id: "whisper-base-fa-hf"
    display_name: "Whisper Base FA (Transformers)"
    enabled: false
    runtime: "transformers_whisper"
    local_path: "models/hf/whisper-base-fa"
    device: "auto"            # روی M1: mps
    compute_type: "float32"
    order: 3
    source:
      type: "huggingface"
      repo_id: "aictsharif/whisper-base-fa"
      convert: "none"
    params:
      language: "fa"
      task: "transcribe"
      num_beams: 5
      max_new_tokens: 200
    notes: "آداپتور مرجع؛ برای مقایسه صحت تبدیل CTranslate2"

  # ------------------------- مدل ۴ (نمونه، غیرفعال) -------------------------
  # الگوی افزودن مدل پنجم/ششم — فقط کپی کن و مقادیر را عوض کن
  - id: "whisper-large-v3-fa-ct2"
    display_name: "Whisper Large-v3 FA (CT2/int8)"
    enabled: false
    runtime: "faster_whisper"
    local_path: "models/faster-whisper/whisper-large-v3-fa"
    device: "auto"
    compute_type: "int8"
    order: 4
    source:
      type: "huggingface"
      repo_id: "nezamisafa/whisper-large-v3-persian"
      convert: "ct2"
      quantization: "int8"
    params:
      language: "fa"
      task: "transcribe"
      beam_size: 5
      vad_filter: false
      without_timestamps: true
    notes: "فقط برای MacBook؛ روی RPi5 8GB توصیه نمی‌شود"